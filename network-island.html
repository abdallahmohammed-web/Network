<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="جزيرة النت: لعبة مغامرات بكسل تعلّمك مادة Computer Networks كأنك طفل، وبيها دروس ومحاكيات وتحديات امتحان.">
<meta name="theme-color" content="#1a1c2c">
<title>جزيرة النت - Network Island</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Tajawal:wght@500;800&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a1c2c;--ink:#f4f4f4;--blue:#41a6f6;--dblue:#3b5dc9;--cyan:#73eff7;--red:#b13e53;--orange:#ef7d57;--yellow:#ffcd75;--green:#38b764;--lime:#a7f070;--purple:#5d275d;--gray:#94b0c2;--dgray:#566c86;--panel:#29366f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#0d0f1c;color:var(--ink);font-family:'Tajawal',system-ui,sans-serif;font-weight:500;overflow:hidden;height:100%;touch-action:manipulation;user-select:none;-webkit-user-select:none}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
#world{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
.en{font-family:'VT323',monospace;font-size:1.25em;direction:ltr;unicode-bidi:isolate;color:var(--cyan);letter-spacing:.5px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.ps{font-family:'Press Start 2P',monospace}
h1,h2,h3,.lal{font-family:'Lalezar','Tajawal',sans-serif;font-weight:400;margin:0}
/* HUD */
#hud{position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:8px;align-items:center;z-index:10;pointer-events:none}
#hud>*{pointer-events:auto}
.hbox{background:#000c;border:3px solid var(--ink);box-shadow:3px 3px 0 #000;padding:5px 8px;display:flex;align-items:center;gap:8px}
.xpbar{flex:1;height:12px;background:#000;border:2px solid var(--ink);position:relative;overflow:hidden;min-width:60px}
.xpbar i{position:absolute;inset:0;width:0;background:repeating-linear-gradient(90deg,var(--lime) 0 6px,var(--green) 6px 8px);transition:width .6s steps(12)}
.tag{font-family:'Press Start 2P';font-size:9px;background:var(--yellow);color:#1a1c2c;padding:4px 6px;border:2px solid #000;white-space:nowrap}
#obj{position:fixed;top:calc(58px + env(safe-area-inset-top));right:8px;left:8px;z-index:9;pointer-events:none;display:flex;justify-content:flex-start}
#obj span{background:#000b;border:2px solid var(--yellow);color:var(--yellow);font-family:'Lalezar';font-size:15px;padding:3px 10px;max-width:100%}
/* controls */
#pad{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:calc(14px + env(safe-area-inset-left));z-index:10;display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:2px;direction:ltr}
#pad button,#abtn{background:#000a;border:3px solid var(--ink);color:#fff;font-size:20px;box-shadow:3px 3px 0 #000;touch-action:none}
#pad button:active,#abtn:active,#pad button.on{background:var(--yellow);color:#000}
#abtn{position:fixed;bottom:calc(40px + env(safe-area-inset-bottom));right:calc(22px + env(safe-area-inset-right));z-index:10;width:76px;height:76px;border-radius:50%;font-family:'Press Start 2P';font-size:22px;background:#b13e53cc}
@media (hover:hover) and (pointer:fine){#pad{opacity:.55}#abtn{opacity:.7}}
/* dialog */
#dlg{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:30;display:none;max-width:640px;margin:0 auto}
#dlg .box{background:#141a3a;border:4px solid var(--ink);box-shadow:inset -4px -4px 0 rgba(0,0,0,.4),6px 6px 0 #000;padding:12px;display:flex;gap:12px;align-items:flex-start;min-height:120px}
#dlg .por{flex:0 0 auto;text-align:center;background:#0d0f1c;border:3px solid var(--gray);padding:4px}
#dlg .nm{position:absolute;top:-16px;right:16px;background:var(--yellow);color:#1a1c2c;font-family:'Lalezar';font-size:17px;padding:2px 12px;border:3px solid #000}
#dlg .tx{flex:1;font-size:18px;line-height:1.75}
#dlg .tx b{color:var(--yellow)}
#dlg .more{position:absolute;bottom:8px;left:12px;color:var(--yellow);font-size:14px}
#dlg .ch{display:flex;flex-direction:column;gap:6px;margin-top:8px}
/* panels */
.scr{position:fixed;inset:0;z-index:40;background:#0d0f1cf2;overflow-y:auto;-webkit-overflow-scrolling:touch}
.scr.hidden{display:none}
.wrap{max-width:540px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 12px calc(60px + env(safe-area-inset-bottom));position:relative}
.panel{background:var(--panel);border:4px solid var(--ink);box-shadow:inset -4px -4px 0 rgba(0,0,0,.35),inset 4px 4px 0 rgba(255,255,255,.08),6px 6px 0 #000;padding:12px;margin:12px 0}
.panel.dark{background:#141626}
.btn{font-family:'Lalezar','Tajawal',sans-serif;font-size:19px;line-height:1.2;padding:10px 16px;background:var(--c,var(--blue));color:#fff;border:4px solid #000;box-shadow:inset -4px -4px 0 rgba(0,0,0,.3),inset 4px 4px 0 rgba(255,255,255,.25),4px 4px 0 #000;text-shadow:2px 2px 0 #1a1c2c;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translate(3px,3px);box-shadow:inset -4px -4px 0 rgba(0,0,0,.3),1px 1px 0 #000}
.btn.g{--c:var(--green)}.btn.r{--c:var(--red)}.btn.o{--c:var(--orange)}.btn.y{--c:var(--yellow);color:#1a1c2c;text-shadow:none}.btn.k{--c:var(--dgray)}.btn.p{--c:#8e44ad}
.btn.sm{font-size:15px;padding:6px 10px}.btn.full{width:100%}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center}.col{display:flex;flex-direction:column;gap:10px}.between{justify-content:space-between}.center{text-align:center}
.small{font-size:14px;color:var(--gray);line-height:1.6}
.modal{position:fixed;inset:0;background:#000b;z-index:50;display:flex;align-items:center;justify-content:center;padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom))}
.modal .panel{max-width:480px;width:100%;max-height:92vh;overflow:auto;margin:0}
/* lesson */
.artbox{background:#0d0f1c;border:4px solid var(--ink);box-shadow:6px 6px 0 #000;padding:4px;margin:12px 0}
.artbox canvas{width:100%;display:block}
.dialog{display:flex;gap:10px;align-items:flex-start}
.dialog .who{flex:0 0 auto;text-align:center;font-family:'Lalezar';font-size:13px;color:var(--yellow)}
.dialog .txt{flex:1;font-size:18px;line-height:1.75;min-height:90px}
.dialog .txt b{color:var(--yellow)}
.exam{background:#2b1d0e;border:4px dashed var(--yellow);padding:10px 12px;margin-top:12px}
.exam h3{color:var(--yellow);font-size:19px;margin-bottom:6px}
.exam ul{margin:0;padding-inline-start:18px}.exam li{margin:5px 0;font-size:15px;line-height:1.6}
.exam li.l{font-family:'VT323';font-size:19px;line-height:1.25;color:#ffe7b3;direction:ltr;text-align:left}
.progress{display:flex;gap:4px;flex-wrap:wrap}.progress i{width:10px;height:10px;background:#444;border:2px solid #000;display:block}.progress i.on{background:var(--yellow)}
.tap{font-family:'Press Start 2P';font-size:9px;color:var(--gray);text-align:left;margin-top:6px}
/* battle */
.arena{background:linear-gradient(#0d0f1c 0 60%,#1d2b1a 60% 100%);border:4px solid var(--ink);box-shadow:6px 6px 0 #000;padding:10px;position:relative;overflow:hidden;margin-top:10px}
.arena .mon{display:flex;flex-direction:column;align-items:center}
.hp{width:70%;height:14px;background:#000;border:3px solid var(--ink);margin:6px auto 0;position:relative}.hp i{position:absolute;inset:0;background:var(--red);transition:width .4s steps(8)}
.hearts{font-size:22px;color:var(--red);letter-spacing:2px;text-shadow:2px 2px 0 #000}.hearts .e{color:#444}
.qcard .q{font-family:'VT323';font-size:24px;line-height:1.15;direction:ltr;text-align:left;color:#fff}
.qcard .ar{font-size:15px;color:var(--yellow);margin-top:8px;line-height:1.6}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;direction:ltr;font-family:'VT323';font-size:21px;line-height:1.1;background:#0d0f1c;color:var(--ink);border:4px solid var(--gray);padding:10px;margin:8px 0;cursor:pointer;box-shadow:4px 4px 0 #000}
.opt .k{flex:0 0 auto;font-family:'Press Start 2P';font-size:11px;background:var(--gray);color:#000;padding:5px 6px}
.opt.sel{border-color:var(--yellow);background:#2b2410}.opt.sel .k{background:var(--yellow)}
.opt.ok{border-color:var(--lime);background:#16361d}.opt.ok .k{background:var(--lime)}
.opt.no{border-color:var(--red);background:#3a1019}.opt.no .k{background:var(--red);color:#fff}
.opt.miss{border-style:dashed;border-color:var(--lime)}
.opt.gone{opacity:.25;pointer-events:none;text-decoration:line-through}
.fb{padding:10px 12px;border:4px solid;margin-top:10px;font-size:16px;line-height:1.7}
.fb.ok{border-color:var(--lime);background:#16361d}.fb.no{border-color:var(--red);background:#3a1019}.fb h3{font-size:21px}
.shake{animation:shake .35s steps(4)}@keyframes shake{25%{transform:translate(-6px,2px)}50%{transform:translate(6px,-2px)}75%{transform:translate(-4px,0)}}
.hit{animation:hit .5s steps(2) 2}@keyframes hit{50%{opacity:.2;filter:brightness(3)}}
.float{animation:flt 1.6s steps(4) infinite}@keyframes flt{50%{transform:translateY(-8px)}}
.bob{animation:bob 1s steps(2) infinite}@keyframes bob{50%{transform:translateY(-5px)}}
.blink{animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:0}}
.flash{position:fixed;inset:0;background:#b13e53;opacity:0;pointer-events:none;z-index:90}.flash.on{animation:fl .3s steps(2)}@keyframes fl{50%{opacity:.45}}
.dmg{position:absolute;font-family:'Press Start 2P';font-size:16px;color:var(--yellow);text-shadow:2px 2px 0 #000;animation:dmg 1s forwards;left:45%;top:30%}@keyframes dmg{to{transform:translateY(-40px);opacity:0}}
.stars{font-size:46px;letter-spacing:6px;color:var(--yellow);text-shadow:4px 4px 0 #000}.stars .e{color:#444}
.big-pop{animation:pop .6s steps(6)}@keyframes pop{from{transform:scale(.2) rotate(-10deg)}to{transform:scale(1)}}
/* games */
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.chip{font-family:'VT323';font-size:22px;direction:ltr;padding:8px 12px;background:#0d0f1c;color:#fff;border:4px solid var(--gray);box-shadow:3px 3px 0 #000;cursor:pointer}
.chip.done{border-color:var(--lime);background:#16361d}
.slot{min-height:46px;border:4px dashed var(--gray);padding:6px;display:flex;flex-wrap:wrap;gap:6px;direction:ltr;align-items:center}
.slot span{font-family:'VT323';font-size:20px;background:var(--green);color:#fff;padding:4px 8px;border:2px solid #000}
.bits{font-family:'Press Start 2P';font-size:20px;direction:ltr;letter-spacing:6px;text-align:center;color:var(--cyan);margin:14px 0}
table.mt{width:100%;border-collapse:collapse;direction:ltr;font-family:'VT323';font-size:20px}
table.mt td,table.mt th{border:2px solid var(--gray);padding:4px 8px;text-align:center}table.mt th{background:var(--dgray)}table.mt tr.new td{background:#16361d;color:var(--lime)}
.pkt{display:flex;justify-content:center;gap:2px;direction:ltr;flex-wrap:wrap;margin:10px 0;min-height:44px}
.pkt span{font-family:'VT323';font-size:20px;color:#1a1c2c;padding:8px 8px;border:3px solid #000;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.pkt span.new{animation:pop .4s steps(4)}
.busline{position:relative;height:60px;margin:14px 0;direction:ltr}
.busline .wire{position:absolute;left:0;right:0;top:28px;height:6px;background:var(--gray)}
.busline .pc{position:absolute;top:0;font-size:28px}
.busline .dot{position:absolute;top:24px;width:12px;height:12px;border:2px solid #000}
@keyframes goR{from{left:6%}to{left:90%}}@keyframes goL{from{left:90%}to{left:6%}}
.gloss{display:grid;gap:6px}.gloss div{background:#0d0f1c;border:3px solid var(--dgray);padding:6px 10px;display:flex;gap:10px;justify-content:space-between;align-items:center}
input.px,textarea.px{font-family:'Tajawal';font-size:18px;padding:10px;background:#000;color:var(--ink);border:4px solid var(--ink);width:100%;outline:none;user-select:text;-webkit-user-select:text}
textarea.px{font-family:'VT323';font-size:16px;direction:ltr;min-height:70px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:2px dashed #ffffff22}
.step{display:flex;gap:10px;align-items:center;background:#0d0f1c;border:3px solid var(--dgray);padding:8px;margin:8px 0}
.step .ic{font-size:26px;width:40px;text-align:center}
.step.done{border-color:var(--lime)}.step.lock{opacity:.5}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{aspect-ratio:1;background:#0d0f1c;border:3px solid var(--dgray);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px;cursor:pointer;text-align:center}
.badge small{font-family:'Lalezar';font-size:11px;color:var(--yellow);line-height:1.1;margin-top:2px}
.badge.no{filter:grayscale(1) brightness(.4)}
#toast{position:fixed;top:96px;left:50%;transform:translateX(-50%);z-index:95;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#000d;border:3px solid var(--yellow);color:#fff;font-family:'Lalezar';font-size:17px;padding:6px 14px;animation:tst 2.6s forwards;white-space:nowrap}
@keyframes tst{0%{transform:translateY(-20px);opacity:0}10%{transform:none;opacity:1}85%{opacity:1}100%{opacity:0}}
.title-logo{text-align:center}
.title-logo .big{font-family:'Lalezar';font-size:56px;line-height:1;color:var(--yellow);text-shadow:4px 4px 0 var(--red),8px 8px 0 #000}
.title-logo .sub{font-family:'Press Start 2P';font-size:12px;color:var(--cyan);margin-top:12px;text-shadow:2px 2px 0 #000;direction:ltr}
.svgbox{background:#0d0f1c;border:4px solid var(--ink);box-shadow:6px 6px 0 #000;margin:10px 0}
.svgbox svg{width:100%;display:block}
.svgbox .hitl{cursor:pointer}
.hidden{display:none!important}
a{color:var(--cyan)}
</style>
</head>
<body>
<canvas id="world"></canvas>
<div id="hud" class="hidden"></div>
<div id="obj" class="hidden"></div>
<div id="pad" class="hidden"><span></span><button data-d="u">▲</button><span></span><button data-d="l">◀</button><span></span><button data-d="r">▶</button><span></span><button data-d="d">▼</button><span></span></div>
<button id="abtn" class="hidden">A</button>
<div id="dlg"></div>
<div id="scr" class="scr hidden"><div class="wrap" id="app"></div></div>
<div id="overlay"></div>
<div id="toast"></div>
<div class="flash" id="flash"></div>
<script>
/* ---------------- PIXEL SPRITES ---------------- */
const PAL={k:'#1a1c2c',w:'#f4f4f4',g:'#94b0c2',d:'#566c86',b:'#41a6f6',B:'#3b5dc9',c:'#73eff7',r:'#b13e53',o:'#ef7d57',y:'#ffcd75',G:'#38b764',l:'#a7f070',p:'#5d275d',n:'#8b5a2b',v:'#b388ff',P:'#ff77a8'};
const SPR={
pc:['................','.kkkkkkkkkkkkkk.','.kggggggggggggk.','.kgbbbbbbbbbbgk.','.kgbccbbbbbbbgk.','.kgbcbbbbbbbbgk.','.kgbbbbbbbbbbgk.','.kgbbbbbbbbbbgk.','.kgbbbbbbbbbbgk.','.kggggggggggggk.','.kkkkkkkkkkkkkk.','......kddk......','....kkddddkk....','...kggggggggk...','...kkkkkkkkkk...','................'],
server:['....kkkkkkkk....','....kggggggk....','....kgddddgk....','....kggggggk....','....kgddddgk....','....kggggggk....','....kgGgggyk....','....kggggggk....','....kgddddgk....','....kggggggk....','....kgddddgk....','....kggggggk....','....kgGgggyk....','....kggggggk....','....kkkkkkkk....','................'],
router:['..k..........k..','..k..........k..','..k..........k..','..k..........k..','.kkkkkkkkkkkkkk.','kBBBBBBBBBBBBBBk','kBccBBBBBBBBccBk','kBBBBwBBBBwBBBBk','kBBBwwwBBwwwBBBk','kBBBBwBBBBwBBBBk','kBBBBBBBBBBBBBBk','kBGBGBGBBBBBBBBk','kBBBBBBBBBBBBBBk','.kkkkkkkkkkkkkk.','.kk..........kk.','................'],

printer:['................','....kkkkkkkk....','....kwwwwwwk....','....kwkkkkwk....','..kkkwwwwwwkkk..','.kggggggggggggk.','.kggggggggggGgk.','.kggggggggggggk.','.kddddddddddddk.','.kgkkkkkkkkkkgk.','.kgkwwwwwwwwkgk.','.kkkwkkkkkkwkkk.','....kwwwwwwk....','....kkkkkkkk....','................','................'],
phone:['................','.....kkkkkk.....','....kddddddk....','....kdbbbbdk....','....kdbccbdk....','....kdbbbbdk....','....kdbbbbdk....','....kdbbbbdk....','....kdbbbbdk....','....kddddddk....','....kddwwddk....','....kddddddk....','.....kkkkkk.....','................','................','................'],
cloud:['................','................','................','.....kkkk.......','....kwwwwk.kk...','..kkwwwwwwkwwk..','.kwwwwwwwwwwwwk.','kwwwwwwwwwwwwwwk','kwwwwwwwwwwwwwwk','kgwwwwwwwwwwwwgk','.kkkkkkkkkkkkkk.','................','................','................','................','................'],
sat:['................','.kkkk......kkkk.','.kbBk......kbBk.','.kBbk..kk..kBbk.','.kbBkkkggkkkbBk.','.kBbk.kggk.kBbk.','.kbBk.kggk.kbBk.','.kkkk..kk..kkkk.','.......kk.......','......kddk......','.......y........','................','................','................','................','................'],
ap:['................','.k............k.','.k............k.','.k............k.','.k............k.','.k............k.','.kkkkkkkkkkkkkk.','kwwwwwwwwwwwwwwk','kwGwGwwwwwwwwwwk','kwwwwwwwwwwwwwwk','.kkkkkkkkkkkkkk.','................','................','................','................','................'],
hero:['.......k........','.......y........','...kkkkkkkkkk...','..kyyyyyyyyyyk..','..kykkyyyykkyk..','..kykwyyyykwyk..','..kyyyyyyyyyyk..','..kyyyrrrryyyk..','..kyyyyyyyyyyk..','...kkkkkkkkkk...','....kbbbbbbk....','...kbbkbbkbbk...','...kkbbbbbbkk...','....kbk..kbk....','....kkk..kkk....','................'],
prof:['..k..........k..','..y..........y..','..k..........k..','.kkkkkkkkkkkkkk.','kBBBBBBBBBBBBBBk','kBkkkkBBBBkkkkBk','kBkwckkkkkwckkBk','kBkkkkBBBBkkkkBk','kBBBBBBBBBBBBBBk','kBBBnnnnnnnnBBBk','kBBnnBBBBBBnnBBk','kBBBBBrrrrBBBBBk','kBGBGBGBBBBBBBBk','kBBBBBBBBBBBBBBk','.kkkkkkkkkkkkkk.','.kk..........kk.'],
slime:['................','................','................','................','......kkkk......','....kkGGGGkk....','...kGGGGGGGGk...','..kGGwwGGwwGGk..','..kGGwkGGwkGGk..','.kGGGGGGGGGGGGk.','.kGGGGkkkkGGGGk.','.kGGGGGGGGGGGGk.','.klGGGGGGGGGGlk.','..kkkkkkkkkkkk..','................','................'],
ghost:['................','.....kkkkkk.....','....kwwwwwwk....','...kwwwwwwwwk...','..kwwkkwwkkwwk..','..kwwkrwwkrwwk..','..kwwwwwwwwwwk..','..kwwwwkkwwwwk..','..kwwwwkkwwwwk..','..kwwwwwwwwwwk..','..kwwwwwwwwwwk..','..kwkwwkwwkwwk..','..kk.kk.kk.kkk..','................','................','................'],
boss:['...y..y..y..y...','...yyyyyyyyyy...','...yryyyyyyry...','..kkkkkkkkkkkk..','.kwwwwwwwwwwwwk.','.kwkkkwwwwkkkwk.','.kwkrkwwwwkrkwk.','.kwkkkwwwwkkkwk.','.kwwwwwkkwwwwwk.','.kwwwwkkkkwwwwk.','..kwwwwwwwwwwk..','..kwkwkwkwkwwk..','..kwwwwwwwwwwk..','...kkkkkkkkkk...','................','................'],
lock:['................','.....kkkkkk.....','....kggggggk....','...kgk....kgk...','...kgk....kgk...','..kkkkkkkkkkkk..','..kyyyyyyyyyyk..','..kyyyykkyyyyk..','..kyyyykkyyyyk..','..kyyyyykyyyyk..','..kyyyyyyyyyyk..','..kkkkkkkkkkkk..','................','................','................','................']
};
const sprCache={};
function spr(name,swap){const key=name+'|'+JSON.stringify(swap||0);if(sprCache[key])return sprCache[key];const rows=SPR[name]||SPR.pc;const c=document.createElement('canvas');c.width=16;c.height=16;const x=c.getContext('2d');rows.forEach((r,j)=>{r=r.padEnd(16,'.').slice(0,16);for(let i=0;i<16;i++){let ch=r[i];if(ch==='.')continue;if(swap&&swap[ch])ch=swap[ch];x.fillStyle=PAL[ch]||ch;x.fillRect(i,j,1,1);}});sprCache[key]=c;return c;}
function sprTag(name,px,swap,cls){return `<canvas class="spr ${cls||''}" width="16" height="16" data-spr="${name}" data-swap='${swap?JSON.stringify(swap):''}' style="width:${px}px;height:${px}px"></canvas>`}

{id:'w1l4',w:0,title:'أشكال الشبكات',en:'Network Topologies',
slides:[
 {art:{t:'topo',k:'star'},
  kid:'**[[Topology]]** يعني **شكل** ترتيب الأجهزة، مثل ما ترتّب ألعابك على الأرض: بخط، بدائرة، بنجمة... عدنا 5 أشكال رئيسية: [[Bus]]، [[Star]]، [[Ring]]، [[Mesh]]، [[Tree]].',
  exam:['Physical topology = the physical layout/pattern of nodes.','It does NOT specify: device types, connectivity methods, addressing schemes.','Types: Bus, Star, Ring, Mesh, Tree (+ Hybrid).']},
 {art:{t:'topo',k:'bus'},
  kid:'**[[Bus]]**: كل الأطفال ماسكين **حبل واحد طويل**. واحد يصيح الرسالة، الكل يسمع، بس صاحبها ياخذها والباقي يطنشون. بطرفين الحبل لازم **[[Terminator]]** (سدّادة). إذا انقطع الحبل؟ **الكل يوگف!** 😱',
  exam:['One long cable (backbone) links all devices; sender broadcasts, destination picks it up, others ignore.','Advantages: easy to connect; less cable than star.','Disadvantages: main cable break = whole network down; requires terminators at both ends; hard to identify problems.','Tutorial Q5: bus not working → check the terminators on either end ✔.']},
 {art:{t:'topo',k:'ring'},
  kid:'**[[Ring]]**: الأطفال ماسكين إيد بعض **بدائرة**، والرسالة تلف من واحد لواحد لحد ما توصل. إذا طفل واحد فلت إيده؟ الدائرة تنكسر! 💔 لهذا صارت **قديمة تقريباً**.',
  exam:['Each node connected to its two nearest nodes forming a circle; data goes around till destination.','High-speed rings use two loops (if one breaks, use opposite direction).','Disadvantages: any cable/device damage can break the whole network; more stations = slower; not flexible/scalable; almost obsolete.']},
 {art:{t:'topo',k:'star'},
  kid:'**[[Star]]**: كل الأطفال مربوطين **بالمعلم بالنص** ([[Hub]] أو [[Switch]]). إذا طفل انقطع، الباقي عادي يلعبون ✅. سهل تضيف أو تشيل جهاز. بس إذا المعلم (النص) طاح… الكل يوگف.',
  exam:['Each node connects to a central hub/switch, which acts as a repeater. Most popular layout today.','Advantages: easy to install & wire; easy to add/remove devices; easy to detect faults; a damaged link is isolated.','Disadvantages: more cable; if the central device fails, attached nodes are disabled.','Tutorial Q2: a ✔ (switch or hub), b ✔ (isolate damaged link), d ✔ (easy add/remove). c ✘ ("closed loop" is ring).']},
 {art:{t:'topo',k:'mesh'},
  kid:'**[[Mesh]]**: كل طفل ماسك إيد **كل الأطفال الباقين!** 🤝 إذا سلك انقطع، أكو طرق ثانية — أقوى شبكة. بس تحتاج أسلاك هوااااية = أغلى شبكة. عدد الأسلاك = **N × (N−1) ÷ 2**.',
  exam:['Every node connected to every other node by its own cable.','Highest fault tolerance; most expensive (cables + NICs).','Number of cables = N(N−1)/2  → 5 PCs: 5×4/2 = 10 cables.','Adding a client = run cables to every other device.']},
 {art:{t:'topo',k:'hybrid'},
  kid:'**[[Tree]]** = نجمة كبيرة بمكان واسع (نجوم مربوطة بنجوم 🌳) نستخدمها لعدد أجهزة كبير. و**[[Hybrid]]** = خلطة! مثلاً نجمة بالنص وفرع منها شكله Bus.',
  exam:['Tree: a star but in a wide area; used for a huge number of nodes or planned growth.','Hybrid: mix, e.g. main star with each branch connecting stations in a bus.']}
],
game:{type:'mesh',title:'حاسبة أسلاك الـ Mesh',prompt:'كم سلك نحتاج؟  N×(N−1)÷2'},
quiz:[
 {q:'Which of the following is true about the star topology? (Choose all that apply)',ar:'شنو الصح عن الـ Star؟ (اختار كل الصح)',o:['Computers can be linked using a switch or hub','If a link is damaged, it can be isolated so other nodes continue communication','There is never a single point of failure, because the design is always a closed loop','Easy to add or remove devices'],a:[0,1,3],e:'a و b و d صح. c غلط — الحلقة المغلقة هي Ring، والـ Star عندها نقطة فشل وحدة (الجهاز اللي بالنص).'},
 {q:'Doctors office uses a traditional bus topology and the network is not working. What might you check?',ar:'شبكة Bus عاطلة، شنو تفحص؟',o:['The hub linking the computers','The terminators on either end of the bus','That all computers are turned on (bus requirement)','The bus transformer which generates energy'],a:[1],e:'الـ Bus يحتاج [[Terminators]] بالطرفين ✔ (سؤال 5).'},
 {q:'How many cables are needed to connect 6 PCs in a full mesh topology?',ar:'6 حاسبات Mesh = كم سلك؟',o:['15','12','30','6'],a:[0],e:'6×5÷2 = 15.'},
 {q:'Which topology offers the highest fault tolerance?',ar:'أقوى تحمّل للأعطال؟',o:['Mesh','Bus','Ring','Star'],a:[0],e:'[[Mesh]] — أكو طرق بديلة دائماً.'},
 {q:'Which topology has become almost obsolete?',ar:'شنو الـ Topology اللي صارت قديمة؟',o:['Ring','Star','Mesh','Tree'],a:[0],e:'[[Ring]] almost obsolete.'},
 {q:'"A star but in a wide area" used for a huge number of nodes describes:',ar:'نجمة بمكان واسع؟',o:['Tree topology','Bus topology','Ring topology','Mesh topology'],a:[0],e:'هذي [[Tree]].'},
 {q:'Physical topology does NOT specify:',ar:'الـ Topology ما تحدد شنو؟',o:['Device types, connectivity methods and addressing schemes','The layout of nodes','The pattern of cables','Where nodes are placed'],a:[0],e:'تحدد الشكل بس، مو أنواع الأجهزة ولا العناوين.'}
]},
{id:'w1l5',w:0,title:'اتجاه الحچي',en:'Transmission Modes',
slides:[

  kid:'**[[Simplex]]** = مثل **التلفزيون أو الراديو** 📺: هو يحچي وانت **بس تسمع**، ما تگدر ترد عليه. مثل **شارع باتجاه واحد**.',
  exam:['Transmission mode = the direction of signal flow between two linked devices.','Simplex: unidirectional, like a one-way street.']},

 {art:{t:'mode',k:'full'},
  kid:'**[[Full-duplex]]** = مثل **التلفون** ☎️: الاثنين يحچون ويسمعون **بنفس الوقت**. طريق باتجاهين!',
  exam:['Full-duplex: both nodes can transmit and receive simultaneously.','Summary: Simplex / Half-duplex / Full-duplex.']}
],

quiz:[

 {q:'A walkie-talkie is an example of:',ar:'الووكي توكي؟',o:['Half-duplex','Simplex','Full-duplex','Broadcast'],a:[0],e:'يحچون بالدور = Half-duplex.'},

 {q:'Communication that is unidirectional, as on a one-way street, is:',ar:'اتجاه واحد مثل شارع؟',o:['Simplex','Half-duplex','Full-duplex','Duplex-mesh'],a:[0],e:'Simplex.'},
 {q:'A telephone call where both people talk and listen simultaneously is:',ar:'مكالمة تلفون؟',o:['Full-duplex','Half-duplex','Simplex','Unicast'],a:[0],e:'Full-duplex.'}

{id:'w2l1',w:1,title:'البروتوكول والطوابق السبعة',en:'Protocols & the OSI model',
slides:[
 {art:{t:'row',items:[['txt','1.Write','#ffcd75'],['txt','2.Envelope','#a7f070'],['txt','3.Address','#73eff7'],['txt','4.Post','#ef7d57']],cap:'Sending a letter = many small tasks'},
  kid:'تذكر **[[Protocol]]** = القوانين. مثل لما ترسل **رسالة بالبريد** ✉️: تكتب، تحط بظرف، تكتب العنوان، تلصق طابع، وتنطيها لساعي البريد. البروتوكول يحدد: شلون تبدي الرسالة وتنتهي، شكلها، شنو نسوي إذا خربت، وإذا انقطع الاتصال.',
  exam:['Protocol = a way of standardizing communications.','Defines: how to start/end a message, how to format it, what to do with corrupted messages (error correction), how to detect unexpected loss of connection, termination of the session.']},
 {art:{t:'osi'},
  kid:'الشبكة مثل **بناية بيها 7 طوابق** 🏢 كل طابق عنده شغلة وحدة، ويساعد الطابق اللي فوگه. هذا اسمه **[[OSI model]]**. أكو موديل ثاني اسمه [[TCP/IP]]. ليش طوابق؟ حتى كل جزء يتطور لوحده، ونحچي لغة وحدة، ونلگى الخلل بسهولة.',
  exam:['Two main stacks: OSI (Open Systems Interconnection) and IETF / TCP/IP.','Protocols in one layer provide services to the layer above.','Why layers? Abstraction, exchange minimal info, common language, technologies evolve independently.','Tutorial Q20: divides communication into smaller simpler parts (design & troubleshooting) ✔; encourages standardization by defining each layer\'s functions ✔.']},
 {art:{t:'osi',hl:[7,6,5,4,3,2,1]},
  kid:'احفظ الطوابق من **فوگ لجوه** بهاي الجملة: **A**ll **P**eople **S**eem **T**o **N**eed **D**ata **P**rocessing 🍕 ➜ Application، Presentation، Session، Transport، Network، Data Link، Physical. ومن جوه لفوگ: **P**lease **D**o **N**ot **T**hrow **S**ausage **P**izza **A**way.',
  exam:['7 Application  6 Presentation  5 Session  4 Transport  3 Network  2 Data Link  1 Physical.','Introduced in the late 1970s by ISO.','Top 3 layers: how applications in end stations communicate. Bottom 4: how data is transmitted.']},
 {art:{t:'osi',hl:[7,6,5],side:'Top 3'},
  kid:'الـ OSI هو **رسمة نظرية** تفهمنا شنو يصير بين جهازين. هو **ما يحدد** نوع الأجهزة أو البرامج، ولا شلون البرامج تحچي ويه بعض، ولا شلون تحچي ويه البشر. 📐',
  exam:['OSI = theoretical representation of what happens between two communicating nodes.','OSI does NOT: prescribe hardware/software for each layer; describe how programs interact with other programs or with humans.','Somewhat superseded by the IETF (TCP/IP) model.']},
 {art:{t:'osi',tcp:true,thl:'Internet',hl:3},
  kid:'موديل **[[TCP/IP]]** (اسمه هم [[DoD model]]) عنده **4 طوابق بس**. طابق [[Internet]] بيه = طابق Network بالـ OSI. وطابق [[Host-to-Host]] = Transport. 🔁',
  exam:['DoD / TCP/IP 4 layers: Application (=OSI 7,6,5), Host-to-Host (=4 Transport), Internet (=3 Network), Network Access (=2,1).','Tutorial Q23: OSI Network layer ≡ DoD Internet layer.']}
],
game:{type:'order',title:'ابني البرج!',prompt:'اضغط الطوابق من 7 (فوگ) لـ 1 (جوه)',items:['7 Application','6 Presentation','5 Session','4 Transport','3 Network','2 Data Link','1 Physical']},
quiz:[
 {q:'Why does the data communication industry use the layered OSI reference model? (Choose all that apply)',ar:'ليش نستخدم الـ OSI؟ (اختار كل الصح)',o:['It divides communication into smaller and simpler components, aiding development, design, and troubleshooting','It enables equipment from different vendors to use the same electronic components','It supports the evolution of multiple competing standards','It encourages industry standardization by defining what functions occur at each layer','It provides a framework by which changes in one layer require changes in other layers'],a:[0,3],e:'الصح a و d. e غلط بالعكس: الفكرة إن التغيير بطابق ما يحتاج تغيير الباقي.'},
 {q:'The DoD model (TCP/IP) has four layers. Which layer is equivalent to the OSI Network layer?',ar:'أي طابق بالـ DoD يساوي Network؟',o:['Application','Host-to-Host','Internet','Network Access'],a:[2],e:'Network ≡ [[Internet]].'},
 {q:'The OSI model was introduced in the late 1970s by:',ar:'منو سوا الـ OSI؟',o:['ISO','IEEE','IETF','Microsoft'],a:[0],e:'[[ISO]] — International Organization for Standardization.'},
 {q:'OSI Layer 3 is the:',ar:'الطابق 3؟',o:['Network layer','Transport layer','Data Link layer','Session layer'],a:[0],e:'7 App, 6 Pres, 5 Sess, 4 Trans, **3 Network**.'},
 {q:'The bottom four layers of the OSI model define:',ar:'الطوابق الأربعة الجوانية تحدد؟',o:['How data is transmitted','How applications communicate','How users log in','How software interacts with humans'],a:[0],e:'Top 3 = التطبيقات، Bottom 4 = نقل البيانات.'},
 {q:'Which layer of the DoD model corresponds to the OSI Transport layer?',ar:'Transport يقابله؟',o:['Host-to-Host','Internet','Application','Network Access'],a:[0],e:'Transport ≡ [[Host-to-Host]].'},
 {q:'The OSI model does NOT:',ar:'الـ OSI ما يسوي شنو؟',o:['Prescribe the type of hardware or software for each layer','Have seven layers','Describe communication between two nodes','Divide networking into layers'],a:[0],e:'نظري بس — ما يحدد أجهزة أو برامج.'}
]},
{id:'w2l2',w:1,title:'الطوابق العليا',en:'Application, Presentation, Session, Transport',
slides:[
 {art:{t:'osi',hl:7},
  kid:'**الطابق 7 [[Application]]** = **الشبّاك** اللي برامجك تحچي منه ويه الشبكة 🪟. انتبه: هو **مو** برنامج Word نفسه! هو الخدمات: نقل ملفات، إدارة ملفات، إيميل، طابعات بعيدة.',
  exam:['Top layer; does NOT include applications like MS Word or Internet Explorer.','Provides file transfer, file management, terminal emulation; sharing remote drives & printers; handles e-mail.','Tutorial Q18k: formatting a response to a web query on screen → Application.']},
 {art:{t:'osi',hl:6},
  kid:'**الطابق 6 [[Presentation]]** = **المترجم** 🈯: يحوّل البيانات لشكل يفتهمه الجهاز الثاني ([[ASCII]])، و**يشفّر** 🔐 و**يضغط** 🗜️ البيانات.',
  exam:['Data translation & coded formatting (e.g. ASCII); ensures one system can read another\'s data.','Encoding, encryption, compression.','Tutorial Q24: formatting, presenting, encoding, converting → Presentation. Q18i: encryption using ASCII → Presentation.']},
 {art:{t:'osi',hl:5},
  kid:'**الطابق 5 [[Session]]** = **منظّم المكالمة** 📞: يفتح الجلسة، يحافظ عليها، ويسكّرها. ويقرر **منو يحچي أول** وشگد يحچي.',
  exam:['Establishing, maintaining and tearing down communication (dialog control).','Orderly communication: who transmits first, when, and for how long.','Tutorial Q18j: signaling for establishing a VoIP connection → Session.']},
 {art:{t:'osi',hl:4,pdu:true},
  kid:'**الطابق 4 [[Transport]]** = **ساعي البريد الدقيق** 📦: يقطع الرسالة الكبيرة لقطع صغيرة اسمها [[Segments]]، **يرقّمها**، ويتأكد كلها وصلت **بالترتيب وبدون أخطاء**. عنده نوعين: [[TCP]] الحريص، و[[UDP]] المستعجل.',
  exam:['End-to-end delivery in correct sequence without errors.','Segmentation & reassembly; sequencing (identify segments of the same data & their order).','TCP = reliable, connection-oriented. UDP = unreliable, connectionless.','Tutorial Q18d,e: app-to-app delivery & end-to-end reliability → Transport.']},
 {art:{t:'handshake'},
  kid:'**TCP** قبل ما يدز يسوي **مصافحة ثلاثية** 🤝 ([[Three-way handshake]]): "ألو؟" — "هلا، تسمعني؟" — "إي أسمعك!". بعدين كل شي يوصل يرد **[[ACK]]** (وصلت ✅). وحتى ما ينتظر بعد كل قطعة، يستخدم **[[Windowing]]** (يدز كم قطعة سوا).',
  exam:['Connection-oriented setup uses a three-way handshake.','Receiver uses sequencing, acknowledgments, and flow control.','Windowing: send several segments before waiting for an ACK.','Flow control = receiver governs how much data the sender sends (based on how fast it can accept).','Tutorial Q21: ACKs, sequencing, flow control → Layer 4. Q22 → c.']}
],

quiz:[

 {q:'What is the purpose of flow control?',ar:'شنو فايدة Flow control؟',o:['To ensure data is retransmitted if an ACK is not received','To reassemble segments in the correct order','To provide a means for the receiver to govern the amount of data sent by the sender','To regulate the size of each segment'],a:[2],e:'المستلم يتحكم بكمية البيانات اللي يدزها المرسل.'},
 {q:'Which layer defines how data is formatted, presented, encoded, and converted for use on the network?',ar:'تنسيق وترميز وتحويل؟',o:['Application','Presentation','Session','Transport'],a:[1],e:'[[Presentation]] = المترجم.'},
 {q:'Signaling for establishing a VoIP connection happens at the:',ar:'فتح مكالمة VoIP؟',o:['Session layer','Physical layer','Network layer','Data link layer'],a:[0],e:'فتح وسد الجلسة = Session.'},
 {q:'End-to-end reliability is addressed at the:',ar:'الوثوقية من طرف لطرف؟',o:['Transport layer','Data link layer','Physical layer','Presentation layer'],a:[0],e:'Transport.'},
 {q:'Which protocol is reliable and connection-oriented?',ar:'البروتوكول الحريص؟',o:['TCP','UDP','IP','ASCII'],a:[0],e:'[[TCP]] حريص، [[UDP]] مستعجل بدون اتصال.'},
 {q:'TCP sets up a connection using a:',ar:'TCP يبدي الاتصال بـ؟',o:['Three-way handshake','Jam signal','Broadcast','Parity check'],a:[0],e:'SYN → SYN-ACK → ACK.'},
 {q:'The Application layer includes software applications such as Microsoft Word.',ar:'صح لو خطأ: الـ Application يشمل برنامج Word؟',o:['True','False'],a:[1],e:'خطأ — هو خدمات الشبكة مو البرنامج نفسه.'}
]},
{id:'w2l3',w:1,title:'الطوابق السفلى',en:'Network, Data Link, Physical',
slides:[
 {art:{t:'osi',hl:3,pdu:true},
  kid:'**الطابق 3 [[Network]]** = **الـ GPS** 🗺️: يحط **العنوان المنطقي [[IP]]** على القطعة فتصير [[Packet]]، ويختار **أحسن طريق** ([[Routing]]) بين الشبكات. الجهاز البطل هنا هو [[Router]].',
  exam:['Adds logical addressing (IP) in a network header → data unit becomes a packet.','Responsibilities: logical addressing (outside network boundary) & routing (between internetworks).','Delivers packets from source host to destination host.','Packets: data packets & route update packets (update neighbor routers). IP = IPv4 or IPv6.','Tutorial Q9: host → host on a different network = router. Q18c → Network.']},
 {art:{t:'osi',hl:2,pdu:true},
  kid:'**الطابق 2 [[Data Link]]** = يوصّل **من جار لجاره** ([[hop to hop]]) 🏃. يقطّع البيانات لـ [[Frames]] ويحط عنوان الكارت [[MAC address]]، ويتأكد ماكو أخطاء.',
  exam:['Divides data into frames for the Physical layer; delivers to the proper device on a LAN using hardware address.','Hop-to-hop (node-to-node) delivery.','Responsible for: access control, error control, flow control, physical addressing (MAC), framing.','Tutorial Q18b: node → neighboring node → Data link.']},
 {art:{t:'osi',hl:1,pdu:true},
  kid:'**الطابق 1 [[Physical]]** = **الأسلاك والإشارات** ⚡: يحوّل الـ 0 والـ 1 لكهرباء أو ضوء أو موجات. هنا نحچي عن نوع السلك، الرأس (الكونيكتر)، قوة الأنتينا، والسرعة.',
  exam:['Transports a raw bit stream between machines.','Covers: interface & medium characteristics, bit representation (bit→signal), data rate, bit synchronization, line configuration (P2P/multipoint), physical topology, medium (wireless/copper/fiber), transmission mode.','Tutorial Q11: distorted NIC signals → Physical. Q18 a,f,g,h: modulation, connector, cable specs, antenna power → Physical.']},
 {art:{t:'route'},
  kid:'سر مهم للامتحان 🤫: الـ **IP** مثل **العنوان النهائي على الظرف** — ما يتغير أبد (ServerB). بس الـ **MAC** مثل **ملصق "المحطة الجاية"** — يتغير بكل خطوة. HostA أول محطة إله هي **RouterA** (السويتش ما يحسب لأنه بس يمرر).',
  exam:['Tutorial Q13: HostA → ServerB: packet with destination IP of ServerB ✔ + frame with destination MAC of RouterA ✔.','IP = end-to-end (fixed). MAC = hop-to-hop (changes at each router).']}
],

{id:'w2l4',w:1,title:'صيّادين الأخطاء',en:'Error Detection',
slides:[
 {art:{t:'text',l:[['Error Detection','#ffcd75'],['1. Simple Parity','#f4f4f4'],['2. Two-dimensional Parity','#f4f4f4'],['3. Checksum','#f4f4f4'],['4. CRC (most powerful)','#a7f070']]},
  kid:'تخيل تدز لصديقك **علبة بيها 7 حلويات** 🍬 وتكتب ورقة "بيها 7". إذا فتحها ولگاها 6؟ يعرف صار شي بالطريق! هيچ الشبكة تضيف معلومات صغيرة حتى المستلم يكشف الأخطاء.',
  exam:['Data Link layer error detection techniques: Simple parity, Two-dimensional parity, Checksum, Cyclic Redundancy Check (CRC).']},
 {art:{t:'parity'},
  kid:'**[[Parity]]**: نعد الـ **1**. إذا عددها **فردي** نضيف **1**، إذا **زوجي** نضيف **0** (حتى يصير المجموع زوجي). بس عيبها: إذا خربت **2 bits سوا** ما تكشفها! 🙈',
  exam:['Simple parity: add 1 if the block has an odd number of 1s, 0 if even.','Drawback: cannot detect multiple errors (e.g. two bits at a time).','Two-dimensional parity: parity bits for each row AND column, sent with data. Fails if 2 bits in one unit and 2 bits in exactly the same positions in another unit change.']},
 {art:{t:'checksum'},
  kid:'**[[Checksum]]**: نقسم البيانات لقطع، **نجمعها** بطريقة خاصة ([[1\'s complement]] — الزايد يرجع ينجمع)، وبعدين **نقلب** الجواب (0↔1). المستلم يجمع كلشي، إذا طلع **كله أصفار بعد القلب** = سليم ✅.',
  exam:['Data divided into k segments of m bits; sender adds them using 1\'s complement arithmetic; the sum is complemented → checksum.','Receiver adds all segments + checksum; complement = 0 → no error.']},
 {art:{t:'crc'},
  kid:'**[[CRC]]** = أقوى صياد 🎯: نضيف أصفار بعدد (درجة المولّد)، نسوي **قسمة XOR**، والباقي نلصقه بالفريم. هذا حل الواجب: Frame **1101011011** و Generator **10011** ➜ نرسل **11010110111110**.',
  exam:['CRC: append (degree of generator) zeros, divide by generator with XOR, append remainder.','HW: Frame 1101011011, generator 10011 → remainder 1110 → transmitted 11010110111110.','The CRC value is in the FCS field; it verifies the integrity of the received frame (Tutorial Q15).']}
],
game:{type:'parity',title:'صيّاد الـ Parity',prompt:'شنو الـ parity bit؟ (Even parity)'},
quiz:[
 {q:'What is the function of the CRC value that is found in the FCS field of a frame?',ar:'شنو فايدة الـ CRC بحقل FCS؟',o:['To verify the integrity of the received frame','To verify the physical address in the frame','To verify the logical address in the frame','To compute the checksum header for the data field'],a:[0],e:'يتأكد الفريم وصل سليم ([[integrity]]).'},
 {q:'Using simple (even) parity, what bit is added to the block 1100101?',ar:'1100101 شنو الـ parity؟',o:['0','1'],a:[0],e:'عدد الـ 1 = 4 (زوجي) → نضيف 0.'},
 {q:'Using simple (even) parity, what bit is added to 1011000?',ar:'1011000 شنو الـ parity؟',o:['1','0'],a:[0],e:'عدد الـ 1 = 3 (فردي) → نضيف 1.'},
 {q:'The main drawback of simple parity check is that it:',ar:'عيب الـ parity البسيط؟',o:['Cannot detect multiple errors such as two bits at a time','Is too slow','Needs a generator polynomial','Uses 1\'s complement'],a:[0],e:'إذا خربت 2 bits ما يحس.'},
 {q:'Frame 1101011011 with CRC generator 10011. The frame to be transmitted is:',ar:'حل الواجب؟',o:['11010110111110','11010110110000','11010110110011','1101011011'],a:[0],e:'الباقي 1110 ينلصق: 1101011011 1110.'},
 {q:'Checksum at the sender adds segments using:',ar:'الـ Checksum يجمع بأي طريقة؟',o:['1\'s complement arithmetic','XOR division','Parity bits','Decimal addition'],a:[0],e:'1\'s complement، وبعدين نقلب الجواب.'}
]},
{id:'w2l5',w:1,title:'تغليف الهدية',en:'Encapsulation & PDUs',
slides:[
 {art:{t:'encap'},
  kid:'**[[Encapsulation]]** = مثل **تغليف هدية** 🎁: الهدية نفسها [[Data]] ← نحطها بعلبة ونرقمها [[Segment]] ← نلفها بورق عليه عنوان البيت [[Packet]] ← نحطها بكيس عليه اسم ساعي التوصيل [[Frame]] ← وتطلع للشارع كـ [[Bits]].',
  exam:['A header (control & addressing info) is added as data moves down the layers = encapsulation.','Removing the extra info at the receiver = decapsulation.','Generic name for data at each level = PDU (Protocol Data Unit).']},
 {art:{t:'osi',pdu:true},
  kid:'كل طابق يسمي الهدية باسم مختلف. احفظها: **D**ata ➜ **S**egment ➜ **P**acket ➜ **F**rame ➜ **B**its. جملة الحفظ: **"D**on\'t **S**ome **P**eople **F**ear **B**irds?" 🐦',
  exam:['Application → Data; Transport → Segment; Network → Packet; Data Link → Frame; Physical → Bits.','Tutorial Q19: Data, segment, packet, frame, bit ✔.']},
 {art:{t:'encap',st:3},
  kid:'خطوات التغليف الخمسة: ١) نبني البيانات ٢) نغلفها للنقل من طرف لطرف ٣) نضيف **IP** بالهيدر ٤) طبقة Data Link تضيف **هيدر + ذيل ([[Trailer]])** ٥) نحوّل الفريم لـ bits. وبالجهاز الثاني نفتح الهدية بالعكس (من 1 لـ 7).',
  exam:['5 steps: build the data; package for end-to-end transport; add network IP address to header; add data link header AND trailer; convert frames to bits.','Sender: PDUs go down layers 6→1; receiver: up to Application. Happens in milliseconds.']}
],

 {q:'The generic term for data at each level of the OSI model is:',ar:'الاسم العام للبيانات بكل طابق؟',o:['Protocol Data Unit (PDU)','Packet','Bitstream','Payload'],a:[0],e:'[[PDU]].'}

{id:'w3l1',w:2,title:'الأسلاك السحرية',en:'Guided Media: Coax, Twisted Pair, Fiber',
slides:[

  kid:'وسائل النقل نوعين: **[[Guided]]** = الإشارة ماشية **داخل سلك** مثل قطار على سكة 🚂 (نحاس أو فايبر). و**[[Unguided]]** = تطير **بالهوا** مثل الطيور 🐦 (راديو، مايكروويف، ستلايت). وكلها تشتغل بالطابق 1 (Physical).',
  exam:['Transmission media works at the OSI Physical layer; makes LANs and WANs possible.','Guided: copper wire & fiber optics. Unguided: radio, microwave, satellite.']},
 {art:{t:'coax'},
  kid:'**[[Coaxial]]** = **سلك التلفزيون القديم** 📺: نحاس بالنص، وحواليه عازل، ودرع معدني، وغلاف. هو أول سلك للإيثرنت بالثمانينات وكان يستخدم كـ **[[Backbone]]** يربط الطوابق والبنايات.',
  exam:['First media for Ethernet (early 1980s); high-capacity; used as backbone to join networks.','Backbone cabling runs between equipment rooms, floors, and buildings → Tutorial Q7 ✔.','Thick: 0.4-inch, hard to bend. Thin: 0.2-inch. Broadband (TV) & baseband (Ethernet). Max length 500 m.','Connectors: BNC T-connector, BNC barrel, BNC terminator.']},
 {art:{t:'twisted'},
  kid:'**[[Twisted pair]]** = أزواج أسلاك **ملتفة على بعض مثل الضفيرة** 💇‍♀️ (الالتفاف يقلل التشويش). نوعين: [[UTP]] بدون درع = **أرخص**، و[[STP]] بدرع فويل = **أغلى بس يقاوم التشويش أكثر**.',
  exam:['Color-coded pairs of insulated copper wires twisted together in a plastic sheath.','UTP: no extra shielding, low cost, less noise-resistant. STP: shielding (foil), high cost, more noise-resistant. Both 10/100/1000 Mbps.','Throughput = amount of bits transferred over a period of time (rate of successful delivery).']},
 {art:{t:'cats'},
  kid:'أسلاك الإيثرنت عدها **فئات (Cat)** مثل الأجيال 📶: كل ما الرقم يكبر = أسرع وأحسن عزل. Cat3 قديم (10M)، Cat5 (100M)، Cat5e و Cat6 (1 جيجا)، Cat6a و Cat7 (10 جيجا).',
  exam:['Cat3 UTP 10 Mbps | Cat5 UTP 10/100 (first Fast Ethernet) | Cat5e UTP 1000 (uses all 4 pairs)','Cat6 UTP/STP 1000 (better insulation, higher SNR) | Cat6a STP 10,000 | Cat7 STP 10 Gbps (Class F, SSTP, fully shielded, must be grounded, hard to bend)']},
 {art:{t:'fiber'},
  kid:'**[[Fiber optic]]** = **أنبوب ضوء!** 💡 الإشارة **ضوء** من ليزر أو LED يمشي بقلب زجاجي ([[Core]]) ويرتد عن الجدار ([[Cladding]]). [[Single Mode]] قلبه رفيع وطريق واحد = مسافات طويلة. [[Multi Mode]] قلبه عريض والضوء يرتد هواية.',
  exam:['Glass/plastic core; data sent as pulsing light (laser/LED); cladding reflects light back to the core.','SMF: core <10 microns, one path, high bandwidth, long distance without repeaters.','MMF: core 50–115 microns (62.5 most common).','Advantages: >10,000 Mbps, very high noise resistance, excellent security, ~100 km. Drawback: most expensive.']},
 {art:{t:'text',l:[['Submarine cables','#73eff7'],['1850: first cable - failed','#f4f4f4'],['1851: protected core - success','#a7f070'],['1892: Britain owns 2/3 of cables','#f4f4f4'],['1988: TAT-8 first fiber Atlantic','#ffcd75']]},
  kid:'أكو **أسلاك تحت البحر** 🌊 تربط القارات! أول واحد سنة 1850 فشل لأن ما محمي، وبـ 1851 نجح. وبسنة **1988** أول فايبر عبر المحيط الأطلسي اسمه **TAT-8** وكان يشيل 40,000 مكالمة.',
  exam:['Aug 1850 Anglo-French Telegraph: England–France, failed (unprotected core). Sep 1851: protected core, success.','1892: British companies owned 2/3 of world cables. 1988: TAT-8 first transatlantic fiber, 40,000 telephone channels.']}
],

{id:'w4l1',w:3,title:'طبقة الربط والأجهزة',en:'Data Link, Ethernet & Devices',
slides:[
 {art:{t:'osi',hl:2},
  kid:'الـ **Packet** ما يعرف يمشي على كل أنواع الطرق (نحاس، فايبر، هوا...). هنا تجي **[[Data Link]]** مثل **سائق** يعرف كل الطرق 🚕: تغلف الباكت بـ Frame يناسب الطريق، وتنظم منو يستخدم الطريق.',
  exam:['Prepares network layer packets for transmission and controls access to the physical media.','Two services: lets upper layers access media (framing); controls placing/receiving data on media (MAC, error detection).','Without it, IP would need provisions for every media type.','MAC method = technique for getting frames on/off the media.']},

  kid:'الـ Data Link بيه **طابقين صغار**: **[[LLC]]** فوگ — **برنامج (software)** يحچي ويه الطوابق العليا ويگول هذا IPv4 لو IPv6. و**[[MAC]]** جوه — يحط العناوين وينظم الدخول للسلك.',

function updateMove(dt){if(PL.moving){PL.mt+=dt/0.15;PL.walkT+=dt;const f=Math.min(1,PL.mt);PL.fx=lerp(PL.sx,PL.x,f);PL.fy=lerp(PL.sy,PL.y,f);if(!(F.sx===F.tx&&F.sy===F.ty)){F.fx=lerp(F.sx,F.tx,f);F.fy=lerp(F.sy,F.ty,f)}if(PL.mt>=1){PL.moving=false;PL.fx=PL.x;PL.fy=PL.y;F.x=F.tx;F.y=F.ty;F.fx=F.x;F.fy=F.y;if(S.steps%20===0){save();checkAch()}}}
 if(!PL.moving&&!busy()){if(PL.path.length){const n=PL.path.shift();const d=n[0]>PL.x?'r':n[0]<PL.x?'l':n[1]>PL.y?'d':'u';if(walkable(n[0],n[1])){PL.dir=d;startMove(n[0],n[1])}else PL.path=[];if(!PL.path.length&&PL.onArrive&&!PL.moving){/*wait*/}}
  else if(PL.onArrive){const f=PL.onArrive;PL.onArrive=null;f()}else if(HELD)tryMove(HELD)}}
function pathTo(tx,ty){const goal=new Set();const e=ENT[k2(tx,ty)];if(walkable(tx,ty))goal.add(k2(tx,ty));else{for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]])if(walkable(tx+dx,ty+dy)||(tx+dx===PL.x&&ty+dy===PL.y))goal.add(k2(tx+dx,ty+dy))}if(!goal.size)return;
 const q=[[PL.x,PL.y]],prev={},seen=new Set([k2(PL.x,PL.y)]);let end=null;let it=0;while(q.length&&it++<4000){const c=q.shift();if(goal.has(k2(...c))){end=c;break}for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=c[0]+dx,ny=c[1]+dy,kk=k2(nx,ny);if(seen.has(kk)||!walkable(nx,ny))continue;seen.add(kk);prev[kk]=c;q.push([nx,ny])}}

let TL={};
function gTopo(){TL={k:'bus',cut:new Set(),task:0,off:new Set(),passed:false};drawTopo()}
function topoGeo(){const k=TL.k,N=[],E=[];
 if(k==='bus'){[40,95,150,205,260].forEach((x,i)=>{N.push([x,45]);E.push(['d'+i,x,58,x,135,[i]])});const xs=[18,40,95,150,205,260,282];for(let j=0;j<xs.length-1;j++)E.push(['b'+j,xs[j],135,xs[j+1],135,null])}
 if(k==='star'){ell(6,150,100,115,68).forEach((p,i)=>{N.push(p);E.push(['e'+i,p[0],p[1],150,100,[i]])})}
 if(k==='ring'){const pts=ell(6,150,95,110,62);pts.forEach((p,i)=>{N.push(p);const q=pts[(i+1)%6];E.push(['e'+i,p[0],p[1],q[0],q[1],[i,(i+1)%6]])})}
 if(k==='mesh'){const pts=ell(5,150,98,105,68);pts.forEach(p=>N.push(p));for(let i=0;i<5;i++)for(let j=i+1;j<5;j++)E.push(['e'+i+'_'+j,pts[i][0],pts[i][1],pts[j][0],pts[j][1],[i,j]])}
 return{N,E}}
function topoOff(N,E){const off=new Set(),k=TL.k,cut=TL.cut;
 if(k==='bus'){if([...cut].some(c=>c[0]==='b'))N.forEach((_,i)=>off.add(i));else cut.forEach(c=>off.add(+c.slice(1)))}
 if(k==='star'){if(cut.has('center'))N.forEach((_,i)=>off.add(i));else cut.forEach(c=>off.add(+c.slice(1)))}
 if(k==='ring'){if(cut.size)N.forEach((_,i)=>off.add(i))}
 if(k==='mesh'){const adj=N.map(()=>[]);E.forEach(e=>{if(!cut.has(e[0])){adj[e[5][0]].push(e[5][1]);adj[e[5][1]].push(e[5][0])}});const comp=[];const seen=new Set();N.forEach((_,i)=>{if(seen.has(i))return;const c=[i];seen.add(i);for(let q=0;q<c.length;q++)adj[c[q]].forEach(n=>{if(!seen.has(n)){seen.add(n);c.push(n)}});comp.push(c)});const big=Math.max(...comp.map(c=>c.length));comp.forEach(c=>{if(c.length<big||big===1)c.forEach(i=>off.add(i))})}
 return off}
function drawTopo(){const{N,E}=topoGeo();const off=topoOff(N,E);TL.off=off;const task=TLT[TL.task];const done=TL.task<TLT.length&&task.ok();

 if(TL.k==='bus'){svg+=`<rect x="8" y="128" width="10" height="14" fill="#ef7d57"/><rect x="282" y="128" width="10" height="14" fill="#ef7d57"/>`}
 if(TL.k==='star'){const c=TL.cut.has('center');svg+=`<g class="hitl" onclick="tlCut('center')"><rect x="128" y="90" width="44" height="20" fill="${c?'#b13e53':'#94b0c2'}" stroke="#000" stroke-width="3"/><text x="150" y="104" font-size="10" text-anchor="middle" font-family="monospace" fill="#000">${c?'DEAD':'SWITCH'}</text></g>`}
 N.forEach((p,i)=>{const o=off.has(i);svg+=`<g><rect x="${p[0]-13}" y="${p[1]-11}" width="26" height="18" fill="${o?'#3a1019':'#16361d'}" stroke="${o?'#b13e53':'#a7f070'}" stroke-width="3"/><rect x="${p[0]-4}" y="${p[1]+7}" width="8" height="5" fill="#94b0c2"/><text x="${p[0]}" y="${p[1]+3}" font-size="11" text-anchor="middle" fill="${o?'#b13e53':'#a7f070'}" font-family="monospace">${o?'✖':'PC'}</text></g>`});
 render(shell(G.g.title,`<div class="row" style="flex-wrap:wrap;justify-content:center">${['bus','star','ring','mesh'].map(k=>`<button class="btn sm ${TL.k===k?'y':'k'}" onclick="TL.k='${k}';TL.cut.clear();sfx.click();drawTopo()"><span class="ltr">${k.toUpperCase()}</span></button>`).join('')}<button class="btn sm g" onclick="TL.cut.clear();drawTopo()">🔧 صلّح</button></div>
 <div class="svgbox"><svg viewBox="0 0 300 175">${svg}</svg></div><div class="small center">🟩 شغّال  🟥 طافي — اضغط على أي كيبل حتى تقطعه</div>
 <div class="panel"><div class="small ltr" style="display:block">TASK ${Math.min(TL.task+1,TLT.length)}/${TLT.length}</div>${TL.task<TLT.length?`<p style="font-size:17px;margin:6px 0">${task.txt}</p>`:''}${done?`<div class="fb ok">${task.msg}</div><button class="btn g full" style="margin-top:8px" onclick="tlNext()">${TL.task<TLT.length-1?'المهمة الجاية ◂':'🏁 خلصت المختبر'}</button>`:''}</div>`));if(done&&!TL.passed){TL.passed=true;sfx.ok()}}
function tlCut(id){TL.cut.has(id)?TL.cut.delete(id):TL.cut.add(id);sfx.bad();TL.passed=false;drawTopo()}
function tlNext(){TL.task++;TL.cut.clear();TL.passed=false;if(TL.task>=TLT.length)return gameWin('صرت خبير طوبولوجي! Bus ينطفي كله، Star يعزل العطل بس السويتش نقطة ضعف، Ring ينكسر، و Mesh أقوى شي.');drawTopo()}

let CS={};
function gCsma(){CS={st:'idle',bBusy:0,heard:0,listenUntil:0,send:0,back:0,deliv:0,coll:0,msg:'اضغط 👂 اسمع حتى تعرف السلك فاضي لو لا.',now:0};drawCsma();SIMT=setInterval(tickCsma,100)}
function tickCsma(){const n=CS.now+=0.1;
 if(CS.bBusy<=n&&Math.random()<0.035&&CS.st!=='sending')CS.bBusy=n+2+Math.random()*2;
 if(CS.st==='sending'){if(CS.bBusy>n&&!CS.bStartedDuring){CS.st='coll';CS.msg='💥 COLLISION! جهاز B دز بنفس الوقت. اضغط 📢 Jam حتى تخبر الكل!';CS.coll++;sfx.bad();flash()}
  else if(Math.random()<0.03){CS.bBusy=n+2;CS.st='coll';CS.msg='💥 COLLISION! B ما سمعك ودز بنفس اللحظة. اضغط 📢 Jam!';CS.coll++;sfx.bad();flash()}
  else if(n>=CS.send){CS.st='idle';CS.deliv++;sfx.ok();CS.msg='✅ الفريم وصل بنجاح! ('+CS.deliv+'/3)';if(CS.deliv>=3){clearInterval(SIMT);SIMT=null;setTimeout(()=>gameWin(`وصّلت 3 فريمات! 🚦 صار عندك ${CS.coll} تصادم وتعاملت وياه صح.<br><span class="en">Listen → Send → Collision? → Jam → Random backoff</span>`),600);return}}}
 if(CS.st==='back'&&n>=CS.back){CS.st='idle';CS.msg='⏳ خلص الانتظار العشوائي. اسمع مرة ثانية!'}
 drawCsma()}
function csAct(a){const n=CS.now;
 if(a==='listen'&&(CS.st==='idle')){CS.listenUntil=n+2;sfx.click();CS.msg=CS.bBusy>n?'🔴 السلك مشغول (B يدز). انتظر شوية واسمع مرة ثانية.':'🟢 السلك فاضي! دز هسه بسرعة.'}
 if(a==='send'&&CS.st==='idle'){if(CS.listenUntil<n){sfx.bad();shake($('#csb'));CS.msg='✋ لازم تسمع أول! (Listen before sending)';return drawCsma()}if(CS.bBusy>n){CS.st='coll';CS.coll++;CS.msg='💥 دزيت والسلك مشغول! COLLISION. اضغط 📢 Jam';sfx.bad();flash()}else{CS.st='sending';CS.send=n+2;CS.bStartedDuring=false;CS.msg='📤 جاري الإرسال...'}}
 if(a==='jam'&&CS.st==='coll'){const w=2+Math.floor(Math.random()*3);CS.st='back';CS.back=n+w;CS.bBusy=Math.min(CS.bBusy,n+1);sfx.click();CS.msg=`📢 Jam signal! الكل وقف. Backoff: انتظر ${w} ثواني (عشوائي)...`}
 drawCsma()}
function drawCsma(){const n=CS.now,bb=CS.bBusy>n,me=CS.st==='sending',col=CS.st==='coll',known=CS.listenUntil>n;
 const html=shell(G.g.title,`<div class="panel dark"><div class="row between"><span class="tag">DELIVERED ${CS.deliv}/3</span><span class="small">💥 ${CS.coll}</span></div>
 <div class="busline"><div class="wire" style="background:${col?'#b13e53':'#94b0c2'}"></div><div class="pc" style="left:2%">💻<div class="small" style="font-size:11px">YOU (A)</div></div><div class="pc" style="right:2%">💻<div class="small" style="font-size:11px">B</div></div>
 ${me?'<div class="dot" style="background:#ffcd75;animation:goR 2s linear infinite"></div>':''}${bb&&(known||col||me)?'<div class="dot" style="background:#73eff7;animation:goL 1.5s linear infinite"></div>':''}${col?'<div style="position:absolute;left:45%;top:8px;font-size:32px">💥</div>':''}</div>
 <div class="center lal" style="font-size:18px;color:${known?(bb?'#b13e53':'#a7f070'):'#94b0c2'}">حالة السلك: ${known?(bb?'🔴 مشغول':'🟢 فاضي'):'❓ ما تعرف (اسمع!)'}</div>
 ${CS.st==='back'?`<div class="center ps" style="font-size:14px;color:var(--yellow);margin-top:6px">BACKOFF ${Math.max(0,CS.back-n).toFixed(1)}s</div>`:''}</div>
 <div class="panel" style="min-height:70px;font-size:17px;line-height:1.7">${CS.msg}</div>
 <div class="row" id="csb"><button class="btn" style="flex:1" onclick="csAct('listen')" ${CS.st==='idle'?'':'disabled'}>👂 اسمع</button><button class="btn g" style="flex:1" onclick="csAct('send')" ${CS.st==='idle'?'':'disabled'}>📤 ارسل</button><button class="btn r" style="flex:1" onclick="csAct('jam')" ${col?'':'disabled'}>📢 Jam</button></div>`);

 setTimeout(()=>{CAMT={x:end[0]*TS+8,y:end[1]*TS-8};emit(end[0]*TS+8,end[1]*TS,30,['#73eff7','#ffcd75','#fff']);const g=GATES.find(g=>g.req===lv);if(g){emit(g.x*TS+8,g.y*TS+8,40,['#ffcd75','#a7f070','#fff']);toast('🔓 بوابة '+WORLDS[g.w].name+' انفتحت!')}sfx.win()},1500);
 setTimeout(()=>{REVEAL=null;CAMT=null;drawHud();const n=lv+1<LEVELS.length?META[lv+1]:null;if(n)say([['p','✨ الكيبل رجع يضوي! المحطة الجاية: **'+n.place+'**. اتبع السهم الأصفر!']]);else say([['p','🏆 خلصت الجزيرة كلها! انت رسمياً **أسطورة الشبكات**. ارسل المحاضرات الجاية حتى نكتشف جزر جديدة! 🏝️']])},3200)}
function levelUp(r){sfx.lvl();const o=document.createElement('div');o.className='modal';o.style.zIndex=96;o.innerHTML=`<div class="center"><div class="ps big-pop" dir="ltr" style="font-size:26px;color:var(--yellow);text-shadow:4px 4px 0 var(--red)">LEVEL UP!</div><div class="bob" style="margin:20px">${sprTag('hero',110)}</div><div class="lal" style="font-size:28px;color:var(--cyan)">صرت: ${RANKS[r][1]}</div><p class="small blink">اضغط للمتابعة</p></div>`;o.onclick=()=>o.remove();document.body.appendChild(o);hydrate();emit(PL.fx*TS+8,PL.fy*TS,40,['#ffcd75','#a7f070','#73eff7'])}

/* ---------------- GLOSSARY / SETTINGS ---------------- */
function showGloss(){closeModal();render(`${topbar('📖 دفتر الكلمات')}<div class="panel"><input class="px" placeholder="دوّر..." oninput="filterGloss(this.value)"></div><div class="gloss" id="gl"></div>`);filterGloss('')}
function filterGloss(v){v=v.toLowerCase();$('#gl').innerHTML=GLOSS.filter(g=>(g[0]+g[1]).toLowerCase().includes(v)).map(g=>`<div><span>${g[1]}</span><span class="en">${g[0]}</span></div>`).join('')}
function showSettings(){closeModal();render(`${topbar('⚙️ الإعدادات')}<div class="panel">
 <div class="toggle"><span>🔊 الأصوات</span><button class="btn sm ${S.sound?'g':'k'}" onclick="S.sound=!S.sound;save();showSettings()">${S.sound?'شغالة':'طافية'}</button></div>
 <div class="toggle"><span>📚 وضع المذاكرة<br><span class="small">يفتح كل الأماكن والبوابات (مراجعة سريعة قبل الامتحان)</span></span><button class="btn sm ${S.study?'g':'k'}" onclick="S.study=!S.study;save();showSettings()">${S.study?'مفعّل':'مطفي'}</button></div>
 <div class="toggle"><span>🧭 رجّعني لنقطة البداية</span><button class="btn sm k" onclick="PL.x=SPAWN[0];PL.y=SPAWN[1];PL.fx=PL.x;PL.fy=PL.y;F.x=F.fx=PL.x+1;F.y=F.fy=PL.y;save();closeScr()">رجوع</button></div>
 <h3 style="margin-top:14px;font-size:20px">💾 نقل التقدم لجهاز ثاني</h3><textarea class="px" id="code" readonly>${btoa(unescape(encodeURIComponent(JSON.stringify(S))))}</textarea>
 <div class="row" style="margin-top:8px"><button class="btn sm y" onclick="copyCode()">نسخ الكود</button><span class="small" id="cpm"></span></div>
 <textarea class="px" id="imp" placeholder="الصق كود هنا..." style="margin-top:10px"></textarea><button class="btn sm g" style="margin-top:8px" onclick="importCode()">استيراد</button>
 <div style="margin-top:20px"><button class="btn r sm" onclick="if(this.dataset.c){try{localStorage.removeItem(KEY)}catch(e){};location.reload()}else{this.dataset.c=1;this.textContent='متأكد؟ اضغط مرة ثانية'}">🗑️ مسح كل التقدم</button></div></div>`)}
function copyCode(){const t=$('#code');try{navigator.clipboard.writeText(t.value).then(()=>$('#cpm').textContent='✔ انسخ',()=>{t.select();$('#cpm').textContent='حدد النص وانسخه يدوياً'})}catch(e){t.select()}}
function importCode(){try{const o=JSON.parse(decodeURIComponent(escape(atob($('#imp').value.trim()))));S=Object.assign(S0(),o);if(S.pos){PL.x=PL.fx=S.pos[0];PL.y=PL.fy=S.pos[1]}save();sfx.win();closeScr()}catch(e){sfx.bad();shake($('#imp'))}}

/* ---------------- TITLE & INTRO ---------------- */
function showTitle(){MODE='title';['#hud','#obj','#pad','#abtn'].forEach(s=>$(s).classList.add('hidden'));
 $('#overlay').innerHTML=`<div class="modal" style="background:linear-gradient(#0d0f1c99,#0d0f1c55 40%,#0d0f1cdd)"><div style="max-width:440px;width:100%"><div class="title-logo"><div class="float" style="display:inline-block">${sprTag('hd0',88)}${sprTag('prof',60)}</div><div class="big">جزيرة<br>النت</div><div class="sub">NETWORK ISLAND</div></div>
 <div class="panel center" style="margin-top:18px"><p style="font-size:16px;line-height:1.8;margin-top:0">مغامرة RPG تتعلم بيها <span class="en">Computer Networks</span>: تمشي بالجزيرة 🏝️، تساعد أهلها، تتعلم ويه <b style="color:var(--yellow)">عمّو راوتر</b>، تجرب محاكيات، وتغلب الوحوش بالامتحانات!</p>
 ${S.name?`<p class="lal" style="font-size:22px;color:var(--lime);margin:6px 0">هلا بيك يا ${esc(S.name)}! 👋</p>`:`<input class="px" id="nm" placeholder="اكتب اسمك يا مغامر..." maxlength="16">`}
 <button class="btn g full" style="margin-top:12px;font-size:24px" onclick="startGame()"><span class="blink">▶</span> ${S.name?'كمّل المغامرة':'ابدأ المغامرة'}</button></div>
 <p class="small center">⬅️➡️ امشِ بالأسهم أو اضغط على الخريطة • A للتحدث</p><div class="center"><button class="btn sm k" onclick="showLanding()">ℹ️ شنو هاي اللعبة؟</button></div></div></div>`;hydrate()}
function startGame(){sfx.click();const n=$('#nm');if(n){S.name=n.value.trim()||'المغامر'}if(S.pos&&walkable(S.pos[0],S.pos[1])){PL.x=PL.fx=S.pos[0];PL.y=PL.fy=S.pos[1];F.x=F.fx=PL.x;F.y=F.fy=PL.y}closeModal();MODE='play';['#hud','#obj','#pad','#abtn'].forEach(s=>$(s).classList.remove('hidden'));save();drawHud();
 if(!S.intro){S.intro=true;save();say([['x','🌊⛵ بعد رحلة طويلة... سفينتك وصلت لـ <b>جزيرة النت</b>!'],['x','بس الجزيرة غريبة... كل الأضواء طافية، والناس ما يگدرون يتواصلون 😟'],['p','هلا هلا! 🤖 آني <b>عمّو راوتر</b>، وراح أكون وياك بكل المغامرة.'],['p','<b>ملك الفوضى</b> 😈 قطّع كل كيبلات الجزيرة، وخلّى وحوش تحرس الأماكن.'],['p','بكل مكان أكو واحد من أهل الجزيرة يحتاجك: أشرحلك الدرس 📖، تسوي مهمة أو محاكاة 🧪، وتغلب الوحش بالتحدي ⚔️'],['p','كل ما تصلح مكان، <b>الكيبل يرجع يضوي</b> ✨ وتاخذ شارة وعملات 🪙'],['p','تمشي بالأسهم أو تضغط على أي مكان بالخريطة 👆 وتحچي ويه الناس بزر <b>A</b> أو تمشي عليهم.'],['p','شوف الصناديق 🎁 بالطريق، ودكان التاجر 🛒 جنبنا. يلا! أول محطة: <b>كوخ المختار</b>. اتبع السهم الأصفر ⬆️']],()=>drawHud())}}

/* ---------------- MAIN LOOP ---------------- */
function frame(ts){const dt=Math.min(0.05,(ts-LAST)/1000);LAST=ts;const t=ts/1000;
 if(MODE==='play')updateMove(dt);
 if($('#scr').classList.contains('hidden'))drawWorld(t,dt);
 if(ART){const{ctx:c,a,t0}=ART;const tt=(ts-t0)/1000;c.fillStyle='#0d0f1c';c.fillRect(0,0,AW,AH);try{ARTS[a.t](c,tt,a)}catch(e){}}
 requestAnimationFrame(frame)}


/* ---------------- LANDING (واجهة تعريفية) ---------------- */
function showLanding(){MODE='title';['#hud','#obj','#pad','#abtn'].forEach(s=>$(s).classList.add('hidden'));
 const F=(i,t,d)=>`<div class="step"><div class="ic">${i}</div><div><b style="font-size:17px">${t}</b><div class="small">${d}</div></div></div>`;
 $('#overlay').innerHTML=`<div class="modal" style="align-items:flex-start;overflow-y:auto;background:linear-gradient(#0d0f1cee,#0d0f1cbb 30%,#0d0f1cee)"><div style="max-width:480px;width:100%;padding-bottom:30px">
 <div class="title-logo" style="margin-top:20px"><div class="row" style="justify-content:center;gap:4px">${sprTag('hd0',72,null,'float')}${sprTag('prof',56,null,'bob')}${sprTag('slime',48)}${sprTag('ghost',48,{w:'v'})}${sprTag('boss',56,null,'float')}</div><div class="big" style="margin-top:10px">جزيرة النت</div><div class="sub">NETWORK ISLAND</div></div>
 <div class="panel center"><h2 style="font-size:26px;color:var(--yellow)">شنو هاي؟ 🤔</h2><p style="font-size:17px;line-height:1.9;margin:8px 0 0">لعبة مغامرات بكسل 🎮 تعلّمك مادة <span class="en">Computer Networks</span> من الصفر، وتشرحها <b style="color:var(--cyan)">كأنك طفل عمرك 5 سنين</b>.<br>انت مهندس شبكات وصلت لجزيرة الشبكة مالتها عاطلة، وكل مكان تصلحه = درس تخلصه ✨</p></div>
 <div class="panel"><h3 style="font-size:22px;margin-bottom:4px">شنو بيها؟</h3>
 ${F('🏝️','جزيرة كاملة تستكشفها','16 مكان، و5 مناطق، و5 بوابات تنفتح وحدة بعد وحدة')}
 ${F('📖','شرح بسيط + خلاصة للامتحان','رسوم متحركة بكل مشهد، وأمثلة من الحياة، والمصطلحات الإنگليزية المهمة')}
 ${F('🧪','محاكيات تجربها بإيدك','تقص كيبلات الشبكة، تنظم التصادمات (CSMA/CD)، تغلّف الباكيت، توصل رسالة بين الراوترات، وتشغّل سويتش')}
 ${F('⚔️','تحديات بأسئلة امتحان','أكثر من 100 سؤال بالإنگليزي مثل الامتحان، ومعها كل أسئلة التوتوريال بمعركة ملك الفوضى')}
 ${F('🪙','مكافآت وتقمّص أدوار','عملات وشارات وإنجازات، ودكان أدوات، وصناديق كنز، وتصعد ليفلات لحد ما توصل "أسطورة الشبكات"')}</div>
 <div class="panel"><h3 style="font-size:22px;margin-bottom:6px">المناطق 🗺️</h3>${WORLDS.map((w,i)=>`<div class="row" style="margin:6px 0"><span style="width:14px;height:14px;background:${w.color};border:2px solid #000;display:inline-block"></span><b>${w.name}</b><span class="en" style="font-size:1em">${w.en}</span></div>`).join('')}</div>
 <div class="panel"><h3 style="font-size:22px;margin-bottom:6px">شلون تلعب؟ 🕹️</h3><p style="font-size:16px;line-height:1.9;margin:0">1️⃣ امشِ بالأسهم، أو اضغط على أي مكان بالخريطة<br>2️⃣ احچي ويه أهل الجزيرة (زر A أو امشِ عليهم)<br>3️⃣ <b>الدرس 📖 ← المحاكاة 🧪 ← التحدي ⚔️</b>، ولازم 70% حتى تعبر<br>4️⃣ الكيبل يضوي ويفتح المكان الجاي ✨</p></div>
 <button class="btn g full" style="font-size:26px;padding:14px" onclick="closeModal();showTitle()"><span class="blink">▶</span> ابدأ المغامرة</button>
 <p class="small center" style="margin-top:12px">يشتغل على الموبايل (آيفون وأندرويد) والكمبيوتر • تقدمك ينحفظ تلقائياً</p></div></div>`;hydrate()}

genMap();if(S.name)showTitle();else showLanding();requestAnimationFrame(frame);

</script>
</body>
</html>
